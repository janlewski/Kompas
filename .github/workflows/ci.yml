name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install SDK packages
        timeout-minutes: 10
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          tool="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          set +o pipefail
          yes | "$tool" --sdk_root="$sdk" --licenses >/dev/null || true
          set -o pipefail
          "$tool" --sdk_root="$sdk" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Unit tests and lint
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lint checkBannedDependencies --stacktrace
      - name: Release APK for the permission check
        timeout-minutes: 15
        run: ./gradlew assembleRelease --stacktrace
      - name: Permission allow-list
        timeout-minutes: 5
        run: |
          chmod +x scripts/check-permissions.sh
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          ./scripts/check-permissions.sh "$apk"
