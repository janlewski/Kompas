name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Unit tests, lint and release assemble
        run: ./gradlew assembleDebug assembleRelease test lint checkBannedDependencies --stacktrace
      - name: Permission allow-list
        run: |
          chmod +x scripts/check-permissions.sh
          ./scripts/check-permissions.sh app/build/outputs/apk/release/app-release.apk
