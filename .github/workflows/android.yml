name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version name, for example 0.2.0 or 0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install SDK packages
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          tool="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          set +o pipefail
          yes | "$tool" --sdk_root="$sdk" --licenses >/dev/null || true
          set -o pipefail
          "$tool" --sdk_root="$sdk" "platforms;android-37" "build-tools;36.0.0"
      - name: Unit tests and lint
        run: |
          chmod +x ./gradlew
          set +e
          for attempt in 1 2 3 4 5; do
            ./gradlew testDebugUnitTest lint checkBannedDependencies --stacktrace && exit 0
            echo "Gradle failed on attempt ${attempt}; Maven Central may be rate-limiting."
            sleep $((attempt * 20))
          done
          exit 1
      - name: Release APK for the permission check
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            ./gradlew assembleRelease --stacktrace && exit 0
            echo "Gradle failed on attempt ${attempt}; Maven Central may be rate-limiting."
            sleep $((attempt * 20))
          done
          exit 1
      - name: Permission allow-list
        run: |
          chmod +x scripts/check-permissions.sh
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          ./scripts/check-permissions.sh "$apk"

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: kompas-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install SDK packages
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          tool="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          set +o pipefail
          yes | "$tool" --sdk_root="$sdk" --licenses >/dev/null || true
          set -o pipefail
          "$tool" --sdk_root="$sdk" "platforms;android-37" "build-tools;36.0.0"
      - name: Check version name
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Version must be SemVer, such as 0.2.0 or 0.2.0-rc.1" >&2
            exit 1
          fi
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kompas-release.jks"
      - name: Unit tests and signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          set +e
          for attempt in 1 2 3 4 5; do
            ./gradlew testDebugUnitTest assembleRelease --stacktrace \
              -PversionName="$VERSION" \
              -PversionCode="$VERSION_CODE" \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/kompas-release.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" && exit 0
            echo "Gradle failed on attempt ${attempt}; Maven Central may be rate-limiting."
            sleep $((attempt * 20))
          done
          exit 1
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kompas-release.jks"
      - name: Permission allow-list
        run: |
          chmod +x scripts/check-permissions.sh
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          ./scripts/check-permissions.sh "$apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "kompas-${VERSION}.apk"
          notes="Sideload build of Kompas. This APK is not a Play Store build."
          if [[ "$VERSION" == *-* ]]; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "$notes" \
              --prerelease \
              "kompas-${VERSION}.apk"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "$notes" \
              "kompas-${VERSION}.apk"
          fi
